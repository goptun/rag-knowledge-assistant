version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  router:
    image: decolua/9router:latest
    container_name: rag_router
    ports:
      - "100.114.121.79:20128:20128"
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: ${ROUTER_INITIAL_PASSWORD}
    volumes:
      - router_data:/app/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - router
    volumes:
      - ../data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  router_data:

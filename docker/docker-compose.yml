version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    # Só em loopback: o Docker publica portas por fora do ufw, então "6333:6333" (= 0.0.0.0) dependia
    # exclusivamente do firewall da nuvem para não expor o Qdrant (sem autenticação) à internet.
    # A API fala com ele pela rede interna do Compose (http://qdrant:6333); o host só precisa do
    # loopback (dev local, scripts de indexação).
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  router:
    image: decolua/9router:latest
    container_name: rag_router
    ports:
      - "100.114.121.79:20128:20128"
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: ${ROUTER_INITIAL_PASSWORD}
    volumes:
      - router_data:/app/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - router
    volumes:
      - ../data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  router_data:

version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - ../.env
    depends_on:
      - qdrant
    volumes:
      - ../data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
